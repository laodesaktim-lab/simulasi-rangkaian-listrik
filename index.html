<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulasi Rangkaian Listrik</title><link rel="stylesheet" href="style.css"></head><body><header><h1>⚡ Simulasi Rangkaian Listrik</h1><p>Seri • Paralel • Gabungan | Kabel terpisah | Lampu menyala saat aktif</p></header><div class="layout"><aside><h2>Komponen</h2><button data-add="battery">🔋 Baterai</button><button data-add="resistor">▰ Resistor</button><button data-add="lamp">💡 Lampu</button><button data-add="switch">⏻ Saklar</button><button id="wire">🔌 Buat Kabel</button><button id="cut">✂️ Putus Kabel</button><button id="junction">● Titik Percabangan</button><button id="del">🗑️ Hapus Komponen</button><button id="clear">Reset</button></aside><main><div id="canvas"><svg id="wires"></svg><div id="hint">Tambahkan komponen lalu klik terminal untuk membuat kabel.</div></div><div class="tools"><button id="select">↖ Pilih/Pindah</button><button id="connect">🔗 Sambung Kabel</button><button id="cut2">✂ Putus Kabel</button></div></main><aside><section><h2>Pengaturan</h2><div id="editor">Pilih komponen.</div></section><section><h2>Hasil</h2><div id="result">Rangkaian belum tertutup.</div><button id="run">▶ Jalankan</button><button id="stop">■ Berhenti</button></section></aside></div><script src="script.js"></script></body></html>
